name: CI

on:
  push:
    branches: [main, rust-rewrite]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  kit-check:
    uses: hangar-ai/.github/.github/workflows/kit-check.yml@rust-rewrite

  # The tab is native (native/, Rust built to WebAssembly): its tests, and the module Hangar runs.
  native:
    name: Native tab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The toolchain native/rust-toolchain.toml pins, with the wasm target and the lints.
      - name: Install the toolchain
        working-directory: native
        run: rustup toolchain install --profile minimal
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Format and lints
        working-directory: native
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        working-directory: native
        run: cargo test --locked
      # Hangar runs the .wasm a kit ships and never builds one, so the committed module has to be
      # the one its source builds: the build is the same bytes on every machine (see the script).
      - name: The committed module is not stale
        run: scripts/build-native.sh --check
